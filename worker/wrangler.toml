# Cloudflare Worker do CazéStats.TV: placar ao vivo, repasse da ESPN com cache de borda, banco D1 e agendador do robô.
# Tudo cabe no plano gratuito. Passo a passo em docs/HOSPEDAGEM.md.
name = "cazestats-api"
main = "ao-vivo.mjs"
compatibility_date = "2024-09-23"

[vars]
# endereço do site que pode ler o Worker ("*" libera qualquer um; o app Android lê com origem própria)
ORIGEM = "*"
# repositório cujo robô de dados o agendador dispara
GITHUB_REPO = "AlanSouzaDev7/Projeto_PeladinhaFC"
# códigos de conta (hash, não é e-mail nem senha) que podem ver o painel do dono (#/painel); separados por vírgula
DONOS = "-Z6xP1h7YtKNcGfWvNbQk7EjfgyqgjDEL3sFerByqPM"
GOOGLE_CLIENT_ID = "545408326652-m42ttef21gt1oroe8ooaff7p2uv5uoc3.apps.googleusercontent.com"  # ID do cliente OAuth do Google (público; "Entrar com Google"). Vazio: login desligado
# placar e lances da API-Football: no máximo a cada N segundos (plano grátis, 100 consultas/dia: 240 ou mais)
INTERVALO_SEGUNDOS = "240"
LISTA_SEGUNDOS = "1800"
RESERVA = "2"

# segredos (nunca neste arquivo):
#   npx wrangler secret put API_FOOTBALL_KEY     (opcional: placar pela API-Football)
#   npx wrangler secret put GITHUB_DISPARO       (token do GitHub só com permissão "Actions: write" neste repositório)

# agendador do robô de dados (ponto 6): a cada 30 min, sem depender do agendamento do GitHub
[triggers]
crons = ["* * * * *", "*/30 * * * *"]  # a cada minuto: alerta de gol; a cada 30 min: robô e limpeza

# banco D1 (criado em 18/11/2026; tabelas em worker/schema.sql)
[[d1_databases]]
binding = "DB"
database_name = "cazestats"
database_id = "b1d7b3bf-78fa-4171-ac27-4c0ded3b707b"

# reserva antiga do "Em alta" (sem o D1): npx wrangler kv namespace create BUSCAS
# [[kv_namespaces]]
# binding = "BUSCAS"
# id = "COLE_O_ID_AQUI"
