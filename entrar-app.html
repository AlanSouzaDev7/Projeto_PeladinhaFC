<!-- Entrar com Google para o app Android: o app abre esta página no navegador do sistema (o Google não deixa entrar
     dentro do app). Depois de entrar, a página devolve ao app um código de uso único (js/entrar-app.js). -->
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: https://lh3.googleusercontent.com; connect-src 'self' https://cazestats-api.alanmartinsdesouza07.workers.dev https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="referrer" content="no-referrer" />
  <title>Entrar no app — CazéStats.TV</title>
  <link rel="icon" href="assets/marca/simbolo.svg" />
  <link rel="stylesheet" href="css/fontes.css" />
  <style>
    :root { color-scheme: dark; --azul: #3b4eea; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0b0d; color: #f1ede1; font: 16px/1.5 Inter, system-ui, sans-serif; }
    main { width: min(420px, calc(100% - 32px)); text-align: center; }
    img { width: 72px; height: 72px; border-radius: 19px; }
    h1 { font: 700 26px/1.2 "Space Grotesk", system-ui, sans-serif; margin: 18px 0 8px; }
    p { margin: 0 0 18px; color: #c9c4b8; }
    #google { display: flex; justify-content: center; min-height: 44px; margin: 8px 0 18px; }
    .voltar { display: inline-block; min-height: 44px; line-height: 44px; padding: 0 22px; border-radius: 999px; background: var(--azul); color: #fff; font-weight: 700; text-decoration: none; }
    .voltar[hidden] { display: none; }
    #msg { min-height: 1.5em; font-size: 14px; }
    .erro { color: #ff8a8a; }
  </style>
</head>
<body>
  <main>
    <img src="assets/marca/icone-192.png" alt="" width="72" height="72" />
    <h1>Entrar no app CazéStats.TV</h1>
    <p>Entre com sua conta Google. Depois você volta para o app, já com favoritos, palpites e bolão.</p>
    <div id="google" aria-live="polite"></div>
    <a class="voltar" id="voltar" href="#" hidden>Voltar para o app</a>
    <p id="msg" role="status" aria-live="polite"></p>
  </main>
  <script src="js/seguranca.js"></script>
  <script src="js/config.js"></script>
  <script src="js/entrar-app.js"></script>
</body>
</html>
