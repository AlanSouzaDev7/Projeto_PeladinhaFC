# PLACAR — atualiza os dados do site sem depender de nenhum computador ligado.
# A cada ~30 minutos o robô roda a API em modo "snapshot" e grava os arquivos de dados em js/ e dados/
# (tabela, jogos, notícias, estatísticas dos jogadores e histórico dos clubes). O GitHub Pages
# publica o resultado sozinho. Placar ao vivo e minuto a minuto rodam no navegador, direto da ESPN.
name: Atualizar dados

on:
  schedule:
    - cron: "*/30 * * * *"   # reserva: o GitHub atrasa horas os agendamentos (em 17/11, 3 rodadas no dia inteiro);
                              # quem mantém o ritmo é o job "proxima" no fim de cada rodada
  workflow_dispatch:          # botão "Run workflow" na aba Actions
  push:                       # roda na hora quando a API ou este arquivo mudam
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/dados.yml"

# permissão mínima: nada por padrão; só este trabalho pode gravar (os arquivos de dados) no repositório
permissions: {}

concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # sem cache (1ª rodada depois de mudar a lista abaixo) passa de 25 min
    permissions:
      contents: write
      actions: write   # disparar a publicação (workflow Publicar) logo depois de gravar os dados
    env:
      TZ: America/Sao_Paulo   # "atualizado em ..." no horário de Brasília
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # súmulas e lances dos jogos encerrados não mudam: guardar entre execuções evita baixar ~650 jogos toda vez.
      # Restaurar e salvar separados: o cache é salvo mesmo quando a rodada falha ou estoura o tempo (antes, uma rodada
      # cancelada não salvava nada e a seguinte começava do zero de novo). A lista de arquivos fica igual nos dois passos.
      - name: Súmulas, lances e fotos já baixados
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            server/cache/partidas.json
            server/cache/partidas-outras.json
            server/cache/lances.json
            server/cache/fotos-jogadores.json
            server/cache/wikidata-clubes.json
            server/cache/rostos.json
            server/cache/comp-*.json
            server/cache/escudos.json
            server/cache/wiki-*.json
            server/cache/af-*.json
            server/cache/mercado-*.json
            server/cache/financas.json
            server/cache/fontes-elenco.json
            server/cache/escalacoes.json
          key: partidas-${{ github.run_id }}
          restore-keys: partidas-

      # detector de rostos (centraliza o rosto no círculo da foto dos jogadores)
      - name: OpenCV
        run: python -m pip install --quiet "opencv-python-headless==4.12.0.88"

      # fotos dos jogadores nos sites oficiais dos clubes (server/fotos_clubes.mjs): o navegador só é instalado nas
      # rodadas em que os sites são relidos (a cada 3 dias e na virada da temporada)
      - name: Os sites dos clubes precisam ser relidos?
        id: sites
        run: |
          python - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, time
          try:
              q = json.load(open("server/cache/mercado-fotos-clubes.json")).get("quando", 0)
          except Exception:
              q = 0
          try:
              t = json.load(open("server/cache/mercado-fotos.json")).get("temp")
          except Exception:
              t = None
          virada = bool(t) and t != int(time.strftime("%Y"))
          print("ler=" + ("sim" if virada or time.time() - q > 3 * 86400 else "nao"))
          PY

      - name: Navegador para ler os sites dos clubes
        if: steps.sites.outputs.ler == 'sim'
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium

      - name: Gerar dados
        timeout-minutes: 38   # estourando, o passo para e o cache ainda é guardado (próxima rodada continua de onde parou)
        run: python -X utf8 server/placar_api.py --snapshot
        env:
          # opcionais: com as chaves das APIs oficiais, o departamento médico também lê os perfis dos setoristas no X e no Instagram
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # opcional: com a chave da API-Football, o calendário dos clubes ganha os torneios que a ESPN não cobre
          # (estaduais do PR, BA, SC e PA, Copa do Nordeste, Copa Verde, Fifa)
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          # opcional: fotos dos jogadores no Flickr (API oficial): as de licença livre e, enquanto o site é de uso do dono,
          # as fotos privadas de quem não tem outra (MODO_VENDA=1 tira)
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}

      - name: Guardar o cache (mesmo se a rodada falhar)
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            server/cache/partidas.json
            server/cache/partidas-outras.json
            server/cache/lances.json
            server/cache/fotos-jogadores.json
            server/cache/wikidata-clubes.json
            server/cache/rostos.json
            server/cache/comp-*.json
            server/cache/escudos.json
            server/cache/wiki-*.json
            server/cache/af-*.json
            server/cache/mercado-*.json
            server/cache/financas.json
            server/cache/fontes-elenco.json
            server/cache/escalacoes.json
          key: partidas-${{ github.run_id }}

      - name: Publicar se algo mudou
        env:
          DADOS_NO_RAMO: ${{ vars.DADOS_NO_RAMO }}
        run: |
          git config user.name "cazestats-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ARQS="js/live-data.js js/player-stats.js js/club-form.js js/heatmaps.js js/departamento-medico.js js/raio-x.js js/jogadores js/squads.js js/competicoes js/mercado js/escalacoes.js js/fotos.js dados img/jogadores"
          if [ "$DADOS_NO_RAMO" = "1" ]; then
            # ponto 5: os dados vão para o ramo "dados" e o main só recebe código (o workflow Publicar junta os dois)
            git fetch origin dados 2>/dev/null && git worktree add /tmp/ramo origin/dados -B dados || git worktree add --orphan -b dados /tmp/ramo
            for a in $ARQS; do [ -e "$a" ] && mkdir -p "/tmp/ramo/$(dirname "$a")" && rm -rf "/tmp/ramo/$a" && cp -r "$a" "/tmp/ramo/$a"; done
            cd /tmp/ramo && git add -A && { git diff --cached --quiet && echo "Nada novo." || { git commit -q -m "Dados atualizados ($(date '+%d/%m %H:%M'))" && git push origin dados; }; }
          else
            git add $ARQS 2>/dev/null || true
            git add -A img/jogadores/ 2>/dev/null || true   # cópias das fotos (o comando de retirada apaga a pasta)
            if git diff --cached --quiet; then
              echo "Nada novo."
            else
              git commit -m "Dados atualizados ($(date '+%d/%m %H:%M'))"
              # outra rodada gravou antes: nos arquivos de dados vale o desta rodada, que é o mais novo
              git pull --rebase -X theirs origin main
              git push
            fi
          fi

      - name: Publicar o site (Cloudflare, quando configurado)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publicar.yml -R "$GITHUB_REPOSITORY" --ref main || echo "publicação não disparada"

  # ritmo garantido: o agendamento do GitHub para repositórios públicos atrasa horas, então cada rodada agenda a
  # seguinte. Espera ROBO_INTERVALO_MIN (variável do repositório, padrão 20) e dispara este workflow de novo.
  # Nunca empilha: o grupo "dados" deixa no máximo uma rodada na fila, e uma rodada nova substitui a que esperava.
  proxima:
    needs: atualizar
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      actions: write
    steps:
      - name: Agendar a próxima rodada
        env:
          GH_TOKEN: ${{ github.token }}
          INTERVALO: ${{ vars.ROBO_INTERVALO_MIN || '20' }}
        run: |
          sleep $(( INTERVALO * 60 ))
          gh workflow run dados.yml -R "$GITHUB_REPOSITORY" --ref main
          echo "próxima rodada disparada"
