# PLACAR — atualiza os dados do site sem depender de nenhum computador ligado.
# A cada 30 minutos o GitHub roda a API em modo "snapshot" e grava os arquivos de dados em js/
# (tabela, jogos, notícias, estatísticas dos jogadores e histórico dos clubes). O GitHub Pages
# publica o resultado sozinho. Placar ao vivo e minuto a minuto rodam no navegador, direto da ESPN.
name: Atualizar dados

on:
  schedule:
    - cron: "*/30 * * * *"   # horário UTC; o GitHub pode atrasar alguns minutos
  workflow_dispatch:          # botão "Run workflow" na aba Actions
  push:                       # roda na hora quando a API ou este arquivo mudam
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/dados.yml"

# permissão mínima: nada por padrão; só este trabalho pode gravar (os arquivos de dados) no repositório
permissions: {}

concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      TZ: America/Sao_Paulo   # "atualizado em ..." no horário de Brasília
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # súmulas dos jogos encerrados não mudam: guardar entre execuções evita baixar ~330 jogos toda vez
      - name: Súmulas já baixadas
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: server/cache/partidas.json
          key: partidas-${{ github.run_id }}
          restore-keys: partidas-

      - name: Gerar dados
        run: python -X utf8 server/placar_api.py --snapshot

      - name: Publicar se algo mudou
        run: |
          git config user.name "placar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/live-data.js js/player-stats.js js/club-form.js js/heatmaps.js
          if git diff --cached --quiet; then
            echo "Nada novo."
          else
            git commit -m "Dados atualizados ($(date '+%d/%m %H:%M'))"
            git pull --rebase origin main
            git push
          fi
