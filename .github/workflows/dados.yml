# PLACAR — atualiza os dados do site sem depender de nenhum computador ligado.
# A cada 30 minutos o GitHub roda a API em modo "snapshot" e grava os arquivos de dados em js/
# (tabela, jogos, notícias, estatísticas dos jogadores e histórico dos clubes). O GitHub Pages
# publica o resultado sozinho. Placar ao vivo e minuto a minuto rodam no navegador, direto da ESPN.
name: Atualizar dados

on:
  schedule:
    - cron: "*/30 * * * *"   # horário UTC; o GitHub pode atrasar alguns minutos
  workflow_dispatch:          # botão "Run workflow" na aba Actions
  push:                       # roda na hora quando a API ou este arquivo mudam
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/dados.yml"

# permissão mínima: nada por padrão; só este trabalho pode gravar (os arquivos de dados) no repositório
permissions: {}

concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      TZ: America/Sao_Paulo   # "atualizado em ..." no horário de Brasília
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # súmulas e lances dos jogos encerrados não mudam: guardar entre execuções evita baixar ~650 jogos toda vez
      - name: Súmulas, lances e fotos já baixados
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            server/cache/partidas.json
            server/cache/partidas-outras.json
            server/cache/lances.json
            server/cache/fotos-jogadores.json
            server/cache/wikidata-clubes.json
            server/cache/rostos.json
            server/cache/comp-*.json
            server/cache/escudos.json
            server/cache/wiki-*.json
            server/cache/af-*.json
            server/cache/mercado-*.json
          key: partidas-${{ github.run_id }}
          restore-keys: partidas-

      # detector de rostos (centraliza o rosto no círculo da foto dos jogadores)
      - name: OpenCV
        run: python -m pip install --quiet "opencv-python-headless==4.12.0.88"

      - name: Gerar dados
        run: python -X utf8 server/placar_api.py --snapshot
        env:
          # opcionais: com as chaves das APIs oficiais, o departamento médico também lê os perfis dos setoristas no X e no Instagram
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # opcional: com a chave da API-Football, o calendário dos clubes ganha os torneios que a ESPN não cobre
          # (estaduais do PR, BA, SC e PA, Copa do Nordeste, Copa Verde, Fifa)
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          # opcional: fotos dos jogadores da temporada no Flickr (API oficial; só fotos com licença livre)
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}

      - name: Publicar se algo mudou
        run: |
          git config user.name "placar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/live-data.js js/player-stats.js js/club-form.js js/heatmaps.js js/departamento-medico.js js/raio-x.js js/jogadores/ js/squads.js js/competicoes/ js/mercado/
          if git diff --cached --quiet; then
            echo "Nada novo."
          else
            git commit -m "Dados atualizados ($(date '+%d/%m %H:%M'))"
            git pull --rebase origin main
            git push
          fi
