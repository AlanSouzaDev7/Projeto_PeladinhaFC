# CazéStats.TV — testes automáticos a cada mudança de código (ponto 4 do relatório de pontos fracos).
# Três etapas independentes, cada uma com limite de tempo (um teste travado não segura a fila por horas):
#   lint      ESLint (JavaScript) e Ruff (Python): erros de verdade, sem mexer no estilo;
#   rapidos   testes de regra e de API em Python, Worker e testes de invasão da API (sem navegador);
#   navegador testes de invasão do site no Chrome, no Safari (WebKit) e no Android, com o site servido localmente.
# Os commits de dados do robô ("Dados atualizados") não disparam: só mudanças de código.
name: Testes

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "js/*.js"
      - "css/**"
      - "index.html"
      - "server/**"
      - "tests/**"
      - "worker/**"
      - "app/montar-www.mjs"
      - "package*.json"
      - ".github/workflows/testes.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Dependências
        run: |
          npm ci --no-audit --no-fund
          python -m pip install --quiet ruff==0.14.5
      - name: ESLint
        timeout-minutes: 4
        run: npx eslint .
      - name: Ruff
        timeout-minutes: 2
        run: python -m ruff check server tests
      - name: Sintaxe de todo o JavaScript
        timeout-minutes: 2
        run: for f in js/*.js server/*.mjs tests/*.mjs tests/mobile/*.mjs tests/seguranca/*.mjs worker/*.mjs; do node --check "$f" || exit 1; done

  rapidos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24   # node:sqlite (banco D1 simulado nos testes)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Regras do departamento médico
        timeout-minutes: 3
        run: python -X utf8 tests/dm_casos.py
      - name: API do mercado, das fotos e das escalações
        timeout-minutes: 5
        run: python -X utf8 tests/mercado_api.py
      - name: API das competições
        timeout-minutes: 3
        run: python -X utf8 tests/competicoes_api.py
      - name: Histórico de jogos (conversão e carga das temporadas)
        timeout-minutes: 2
        run: python -X utf8 tests/historico_casos.py
      - name: Carreiras dos jogadores (quem é quem e linha do tempo)
        timeout-minutes: 2
        run: python -X utf8 tests/carreiras_casos.py
      - name: Checagem dos dados (defesas x chutes bloqueados, números sem sentido)
        run: python -X utf8 tests/checagem_casos.py
      - name: Candidatos da seleção da rodada
        run: python -X utf8 tests/selecao_casos.py
      - name: Verificação dos jogadores (homônimos, fotos e cria da base)
        run: python -X utf8 tests/verifica_jogadores_casos.py
      - name: Valores do Transfermarkt (quem é quem, valor real e estimativa calibrada)
        run: python -X utf8 tests/valores_tm_casos.py
      - name: Busca de imagem do Brave (conferência do título, cota e cache)
        run: python -X utf8 tests/busca_imagem_casos.py
      - name: Emprestados (destino limpo e ligação só no clube de destino)
        run: python -X utf8 tests/emprestados_casos.py
      - name: Disjuntor dos pedidos (site recusando não estoura o tempo da rodada)
        run: python -X utf8 tests/disjuntor_casos.py
      - name: Elencos do Transfermarkt (leitor das páginas e valores de hoje por cima dos de julho)
        run: python -X utf8 tests/tm_elencos_casos.py
      - name: Perfil tático (1º e 2º volante, marcação e recomposição)
        run: python -X utf8 tests/tatica_casos.py
      - name: Fotos da artilharia (Transfermarkt e TheSportsDB para quem a ESPN não fotografa)
        run: python -X utf8 tests/fotos_artilharia_casos.py
      - name: Carreiras pelo Transfermarkt (clubes que faltavam, empréstimos)
        run: python -X utf8 tests/carreiras_tm_casos.py
      - name: Balancete da janela (folha e caixa só do ge e da ESPN, folha só antes da janela abrir)
        run: python -X utf8 tests/financas_casos.py
      - name: Posições do elenco (escalações, Transfermarkt e correções)
        run: python -X utf8 tests/posicoes_casos.py
      - name: Worker do placar ao vivo
        timeout-minutes: 2
        run: node tests/worker.mjs
      - name: Robô enviando os dados ao banco D1 (Worker local, SQLite simulado)
        timeout-minutes: 3
        run: node tests/enviar-d1.mjs
      - name: Alerta de gol (Worker, ESPN e push simulados)
        timeout-minutes: 2
        run: node tests/alertas.mjs
      - name: Agenda do favorito (calendário .ics)
        run: node tests/agenda.mjs
      - name: Bolão (palpites, pontos, ranking e ligas)
        run: node tests/bolao.mjs
      - name: Bolão por rodada e conquistas
        run: node tests/bolao-rodada.mjs
      - name: Voz da torcida e status do sistema
        run: node tests/torcida.mjs
      - name: Crescimento (resumo automático e páginas para buscadores)
        run: node tests/crescimento.mjs
      - name: Painel do dono e visitas anônimas
        run: node tests/painel.mjs
      - name: Gráfico de pressão
        run: node tests/pressao.mjs
      - name: Proteção contra abuso
        run: node tests/protecao.mjs
      - name: Mapa de chutes e xG
        run: node tests/chutes.mjs
      - name: Previsão da tabela final
        run: node tests/previsao.mjs
      - name: Resumo da rodada
        run: node tests/rodada.mjs
      - name: Por que essa nota (a conta bate com as notas do robô)
        run: node tests/nota.mjs
      - name: Replay do gol (13 gols reais)
        run: node tests/replay.mjs
      - name: Pergunte ao CazéStats (perguntas e respostas com dados reais)
        run: node tests/pergunte.mjs
      - name: Assistente de reforços (a pergunta vira filtros; continentes)
        run: node tests/assistente-reforcos.mjs
      - name: Conta com Google e sincronização (comprovantes e banco simulados)
        timeout-minutes: 2
        run: node tests/conta.mjs
      - name: Testes de invasão da API
        timeout-minutes: 5
        run: node tests/seguranca/api.mjs

  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Playwright (Chromium e WebKit)
        timeout-minutes: 25   # o download do WebKit às vezes passa de 8 min (3 vezes em 18/11) e de 15 (2 vezes em 26/11)
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: Testes de invasão do site (PC, iPhone, Android)
        timeout-minutes: 8
        run: |
          python3 -m http.server 5174 --bind 127.0.0.1 > /dev/null 2>&1 &
          sleep 2
          BASE=http://127.0.0.1:5174 node tests/seguranca/site.mjs
