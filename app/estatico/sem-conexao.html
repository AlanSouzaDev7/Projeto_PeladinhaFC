<!-- CazéStats.TV (app Android) — a única página que vem dentro do APK. O app abre o site publicado
     (capacitor.config.json: server.url); esta página aparece quando ele não carrega: sem internet na primeira abertura
     ou Android System WebView antigo demais (android.minWebViewVersion). Sem script externo, sem fontes, CSS simples. -->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CazéStats.TV</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0b0d; color: #f1ede1; font-family: sans-serif; }
      .caixa { box-sizing: border-box; max-width: 420px; margin: 0 auto; padding: 15vh 24px 24px; text-align: center; }
      .simbolo { width: 72px; height: 72px; margin: 0 auto 20px; display: block; }
      h1 { font-size: 22px; margin: 0 0 10px; }
      p { color: #c9c4b8; line-height: 1.5; margin: 0 0 14px; }
      a.botao { display: inline-block; margin-top: 10px; padding: 14px 26px; border-radius: 999px; background: #3b4eea; color: #fff; font-weight: bold; text-decoration: none; }
      small { display: block; margin-top: 28px; color: #8c877c; line-height: 1.5; }
    </style>
  </head>
  <body>
    <div class="caixa">
      <svg class="simbolo" viewBox="0 0 100 100" aria-hidden="true">
        <rect width="100" height="100" rx="26" fill="#3B4EEA" />
        <g fill="#F1EDE1">
          <rect x="25.5" y="19.5" width="9" height="9" rx="3" />
          <rect x="65.5" y="19.5" width="9" height="9" rx="3" />
          <rect x="25.5" y="37.5" width="9" height="9" rx="3" />
          <rect x="45.5" y="37.5" width="9" height="9" rx="3" />
          <rect x="65.5" y="37.5" width="9" height="9" rx="3" />
          <rect x="18.5" y="55.5" width="9" height="9" rx="3" />
          <rect x="36.5" y="55.5" width="9" height="9" rx="3" />
          <rect x="54.5" y="55.5" width="9" height="9" rx="3" />
          <rect x="72.5" y="55.5" width="9" height="9" rx="3" />
          <rect x="45.5" y="73.5" width="9" height="9" rx="3" />
        </g>
        <rect x="45.5" y="19.5" width="9" height="9" rx="3" fill="#C6F432" />
      </svg>
      <h1>Não deu para abrir o CazéStats.TV</h1>
      <p>Confira se o celular está com internet. Depois de abrir uma vez, o app guarda os últimos dados e funciona mesmo sem conexão.</p>
      <a class="botao" href="https://cazestats.pages.dev/">Tentar de novo</a>
      <small>Se o problema continuar, atualize o "Android System WebView" e o "Google Chrome" na Play Store.</small>
    </div>
  </body>
</html>
