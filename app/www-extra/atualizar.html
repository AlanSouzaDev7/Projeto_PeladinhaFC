<!doctype html>
<!-- 433Fut — aberta pelo Capacitor quando o Android System WebView do aparelho é antigo demais (capacitor.config.json:
     android.minWebViewVersion). Feita para navegadores antigos: sem script, sem fontes externas, sem recursos novos de CSS. -->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>433Fut — atualize o WebView</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0b0d;
        color: #f1ede1;
        font-family: sans-serif;
      }
      .caixa {
        box-sizing: border-box;
        max-width: 420px;
        margin: 0 auto;
        padding: 15vh 24px 24px;
        text-align: center;
      }
      .simbolo {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 12px;
      }
      p {
        font-size: 15px;
        line-height: 1.5;
        color: #c4c1b8;
        margin: 0 0 22px;
      }
      a {
        display: block;
        padding: 14px 18px;
        margin: 0 0 12px;
        border-radius: 12px;
        background: #3b4eea;
        color: #f1ede1;
        font-weight: bold;
        text-decoration: none;
      }
      a.leve {
        background: transparent;
        border: 1px solid #2a2c33;
        font-weight: normal;
      }
    </style>
  </head>
  <body>
    <div class="caixa">
      <svg class="simbolo" viewBox="0 0 100 100" aria-hidden="true">
        <rect width="100" height="100" rx="26" fill="#3B4EEA" />
        <g fill="#F1EDE1">
          <rect x="25.5" y="19.5" width="9" height="9" rx="3" />
          <rect x="65.5" y="19.5" width="9" height="9" rx="3" />
          <rect x="25.5" y="37.5" width="9" height="9" rx="3" />
          <rect x="45.5" y="37.5" width="9" height="9" rx="3" />
          <rect x="65.5" y="37.5" width="9" height="9" rx="3" />
          <rect x="18.5" y="55.5" width="9" height="9" rx="3" />
          <rect x="36.5" y="55.5" width="9" height="9" rx="3" />
          <rect x="54.5" y="55.5" width="9" height="9" rx="3" />
          <rect x="72.5" y="55.5" width="9" height="9" rx="3" />
          <rect x="45.5" y="73.5" width="9" height="9" rx="3" />
        </g>
        <rect x="45.5" y="19.5" width="9" height="9" rx="3" fill="#C6F432" />
      </svg>
      <h1>Falta uma atualização no aparelho</h1>
      <p>
        O 433Fut usa o navegador interno do Android (Android System WebView), que neste aparelho está desatualizado. Atualize pela Play
        Store e abra o app de novo.
      </p>
      <a href="market://details?id=com.google.android.webview">Atualizar o Android System WebView</a>
      <a class="leve" href="market://details?id=com.android.chrome">Ou atualize o Google Chrome</a>
    </div>
  </body>
</html>
